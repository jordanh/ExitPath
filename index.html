<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ExitPath: open-source alternatives and what it takes to switch</title>
    <meta
      name="description"
      content="A catalog of open-source alternatives to common proprietary tools: what transfers, what does not, how hard the move is, and step-by-step checklists. Runs in your browser with no account."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Link previews. The absolute image and page addresses are added at build time when the site's URL is known (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExitPath" />
    <meta property="og:title" content="ExitPath: open-source alternatives and what it takes to switch" />
    <meta
      property="og:description"
      content="A catalog of open-source alternatives to common proprietary tools: what transfers, what does not, and how hard the move is."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Applies the saved theme before first paint. A file, not inline, so inline scripts can be forbidden. -->
    <script src="./theme.js" vite-ignore></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
